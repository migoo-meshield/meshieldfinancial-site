name: Fix insurance article image mapping

on:
  push:
    paths:
      - '.github/workflows/refresh-insurance-thumbnails.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-image-mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct blog cards and article hero images
        shell: python
        run: |
          from pathlib import Path
          import re

          mapping = {
              '/hurricane-season-home-insurance-checklist': 'article-umbrella-flood.jpg',
              '/homeowners-renters-insurance-florida-guide': 'article-homeowners-renters.jpg',
              '/umbrella-flood-insurance-florida': 'article-hurricane-insurance.jpg',
          }

          pages = {
              'hurricane-season-home-insurance-checklist.html': 'article-umbrella-flood.jpg',
              'homeowners-renters-insurance-florida-guide.html': 'article-homeowners-renters.jpg',
              'umbrella-flood-insurance-florida.html': 'article-hurricane-insurance.jpg',
          }

          for filename, image in pages.items():
              p = Path(filename)
              text = p.read_text()
              text, n = re.subn(
                  r"background-image:\s*url\('article-(?:hurricane-insurance|homeowners-renters|umbrella-flood)\.jpg'\);",
                  f"background-image: url('{image}');",
                  text,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f'Could not update hero image in {filename}')
              text = re.sub(
                  r'<meta property="og:image" content="https://meshieldfinancial\.com/(?:logo\.png|article-(?:hurricane-insurance|homeowners-renters|umbrella-flood)\.jpg)"/>',
                  f'<meta property="og:image" content="https://meshieldfinancial.com/{image}"/>',
                  text,
                  count=1,
              )
              p.write_text(text)

          blog = Path('blog.html')
          text = blog.read_text()
          cards = list(re.finditer(r'<article\b.*?</article>', text, re.S))
          changed = 0
          for card in reversed(cards):
              block = card.group(0)
              target = next(((href, image) for href, image in mapping.items() if f'href="{href}"' in block), None)
              if not target:
                  continue
              href, image = target
              new_block, n = re.subn(
                  r"background-image:url\('article-(?:hurricane-insurance|homeowners-renters|umbrella-flood)\.jpg'\)",
                  f"background-image:url('{image}')",
                  block,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f'Could not update blog card for {href}')
              text = text[:card.start()] + new_block + text[card.end():]
              changed += 1
          if changed != 3:
              raise SystemExit(f'Expected 3 blog cards, updated {changed}')
          blog.write_text(text)

      - name: Verify exact final mapping
        shell: bash
        run: |
          set -euo pipefail
          grep -q "background-image: url('article-umbrella-flood.jpg');" hurricane-season-home-insurance-checklist.html
          grep -q "background-image: url('article-homeowners-renters.jpg');" homeowners-renters-insurance-florida-guide.html
          grep -q "background-image: url('article-hurricane-insurance.jpg');" umbrella-flood-insurance-florida.html
          grep -q "article-umbrella-flood.jpg" blog.html
          grep -q "article-homeowners-renters.jpg" blog.html
          grep -q "article-hurricane-insurance.jpg" blog.html
          test -f article-umbrella-flood.jpg
          test -f article-homeowners-renters.jpg
          test -f article-hurricane-insurance.jpg

      - name: Commit mapping fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog.html \
                  hurricane-season-home-insurance-checklist.html \
                  homeowners-renters-insurance-florida-guide.html \
                  umbrella-flood-insurance-florida.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Correct insurance article image mapping'
          git push origin HEAD:main
