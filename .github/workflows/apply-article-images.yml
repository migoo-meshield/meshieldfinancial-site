name: Apply article-specific images

on:
  push:
    branches:
      - agent/update-blog-article-images
    paths:
      - '.github/workflows/apply-article-images.yml'

permissions:
  contents: write

jobs:
  apply-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-blog-article-images
          fetch-depth: 0

      - name: Update article heroes, social images, and blog thumbnails
        shell: python
        run: |
          from pathlib import Path
          import re

          mapping = {
              'haitian-household-money-habits.html': ('/haitian-household-money-habits', 'article-haitian-money-habits.jpg'),
              'tps-haiti-2026-update.html': ('/tps-haiti-2026-update', 'article-tps-haiti-2026.jpg'),
              'naturalization-process-guide.html': ('/naturalization-process-guide', 'article-naturalization-process.jpg'),
              'infinite-banking-concept.html': ('/infinite-banking-concept', 'article-infinite-banking-guide.jpg'),
          }

          def set_article_image(filename, image):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')

              # Most newer articles use an inline .page-hero image; older ones may use .article-hero CSS.
              inline = re.compile(r'(<div class="page-hero has-photo" style="[^"]*background-image:\s*url\([\'\"])([^\'\"]+)([\'\"]\)[^"]*">)', re.S)
              text, count = inline.subn(lambda m: m.group(1) + image + m.group(3), text, count=1)
              if count == 0:
                  css = re.compile(r'(\.article-hero\s*\{.*?background-image:\s*url\([\'\"])([^\'\"]+)([\'\"]\);)', re.S)
                  text, count = css.subn(lambda m: m.group(1) + image + m.group(3), text, count=1)
              if count != 1:
                  raise SystemExit(f'Could not update hero image in {filename}')

              og = re.compile(r'<meta property="og:image" content="[^"]*"\s*/>')
              replacement = f'<meta property="og:image" content="https://meshieldfinancial.com/{image}"/>'
              text, og_count = og.subn(replacement, text, count=1)
              if og_count != 1:
                  raise SystemExit(f'Could not update og:image in {filename}')
              p.write_text(text, encoding='utf-8')

          for filename, (_, image) in mapping.items():
              set_article_image(filename, image)

          blog_path = Path('blog.html')
          blog = blog_path.read_text(encoding='utf-8')
          for filename, (href, image) in mapping.items():
              article_pattern = re.compile(r'<article\b[^>]*>.*?</article>', re.S)
              updated = False
              for match in list(article_pattern.finditer(blog)):
                  block = match.group(0)
                  if f'href="{href}"' not in block:
                      continue
                  thumb = re.compile(r'(class="blog-card-thumb"[^>]*style="[^"]*background-image:\s*url\([\'\"])([^\'\"]+)([\'\"]\)[^"]*")', re.S)
                  new_block, thumb_count = thumb.subn(lambda m: m.group(1) + image + m.group(3), block, count=1)
                  if thumb_count != 1:
                      raise SystemExit(f'Could not update blog thumbnail for {href}')
                  blog = blog[:match.start()] + new_block + blog[match.end():]
                  updated = True
                  break
              if not updated:
                  raise SystemExit(f'Could not find blog card for {href}')
          blog_path.write_text(blog, encoding='utf-8')

          # Validate each image is present in its article, OG tag, and matching blog card.
          for filename, (href, image) in mapping.items():
              text = Path(filename).read_text(encoding='utf-8')
              if image not in text:
                  raise SystemExit(f'Article validation failed for {filename}')
              if f'https://meshieldfinancial.com/{image}' not in text:
                  raise SystemExit(f'og:image validation failed for {filename}')
              blocks = [m.group(0) for m in re.finditer(r'<article\b[^>]*>.*?</article>', blog, re.S) if f'href="{href}"' in m.group(0)]
              if len(blocks) != 1 or image not in blocks[0]:
                  raise SystemExit(f'Blog card validation failed for {href}')

      - name: Commit validated mappings
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/apply-article-images.yml
          git add -A
          git commit -m 'Use article-specific images for four blog posts'
          git push origin HEAD:agent/update-blog-article-images
